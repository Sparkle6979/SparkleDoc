<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="沉思室">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>沉思室</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0A0A0A;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0A0A0A;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
  <script src="flutter_bootstrap.js" async=""></script>
  
  <!-- Minimalist Loading Screen for Philosophy Sayings -->
  <div id="loading-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FAFAFA; z-index: 9999;">
    <!-- 极简几何加载动画 -->
    <div style="width: 12px; height: 12px; background-color: #111111; animation: abstract-spin 2s infinite cubic-bezier(0.4, 0, 0.2, 1);"></div>
    
    <div style="margin-top: 32px; color: #333333; font-family: -apple-system, BlinkMacSystemFont, 'Times New Roman', serif; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;">Waking up the philosophers</div>
    <div style="margin-top: 10px; color: #999999; font-family: 'PingFang SC', 'Noto Sans SC', serif; font-size: 11px; letter-spacing: 0.3em; margin-right: -0.3em;">正在唤醒哲人...</div>
    
    <style>
      @keyframes abstract-spin {
        0% { transform: scale(0.8) rotate(0deg); opacity: 0.3; border-radius: 0%; }
        50% { transform: scale(1.2) rotate(180deg); opacity: 0.9; border-radius: 50%; }
        100% { transform: scale(0.8) rotate(360deg); opacity: 0.3; border-radius: 0%; }
      }
    </style>
  </div>
  
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.transition = 'opacity 0.6s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 600);
      }
    });
  </script>
</body></html>
